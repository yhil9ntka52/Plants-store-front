<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Plant Store – Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 text-beige">Plant Store</span>
        </div>
    </nav>
    <div class="container">
        <h2>Account Dashboard</h2>
        <div id="account-info" class="mb-2"></div>
        <button id="logout-btn" class="btn btn-outline-danger menu-btn">Logout</button>
        <hr>
        <div>
            <a href="public.html" class="btn btn-secondary menu-btn">Back to catalog</a>
        </div>
    </div>
    <footer class="footer mt-5 pt-3 text-center">
        PlantStore &copy; 2025
    </footer>
    <script>
        if (!localStorage.getItem('access_token')) {
            let redirect = encodeURIComponent('private.html');
            window.location.href = 'login.html?next=' + redirect;
        }
        $('#account-info').text('Welcome, ' + (localStorage.getItem('username') || 'user'));
        $('#logout-btn').click(function(){
            localStorage.clear();
            window.location.href = 'public.html';
        });
    </script>
</body>
</html>
