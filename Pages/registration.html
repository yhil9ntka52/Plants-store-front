<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration – Plant Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 text-beige">Plant Store</span>
        </div>
    </nav>
    <div class="container" style="max-width:420px;">
        <h2>Registration</h2>
        <form id="reg-form">
            <input type="text" class="form-control mb-2" id="username" placeholder="Username" required>
            <input type="text" class="form-control mb-2" id="first_name" placeholder="First name">
            <input type="text" class="form-control mb-2" id="last_name" placeholder="Last name">
            <input type="email" class="form-control mb-2" id="email" placeholder="Email" required>
            <input type="password" class="form-control mb-2" id="password" placeholder="Password" required>
            <input type="password" class="form-control mb-2" id="password2" placeholder="Repeat password" required>
            <button type="submit" class="btn btn-success w-100">Register</button>
        </form>
        <div id="reg-result" class="mt-2"></div>
        <div class="mt-4 text-end">
            <a href="login.html" class="link-success">Already have an account?</a>
        </div>
    </div>
    <footer class="footer mt-5 pt-3 text-center">
        PlantStore &copy; 2025
    </footer>
    <script>
        if (localStorage.getItem('access_token')) {
            window.location.href = 'private.html';
        }
        $('#reg-form').submit(function(e){
            e.preventDefault();
            let data = {
                username: $('#username').val(),
                first_name: $('#first_name').val(),
                last_name: $('#last_name').val(),
                email: $('#email').val(),
                password: $('#password').val(),
                password2: $('#password2').val()
            };
            $.ajax({
                url: 'http://localhost:8000/api/v1/accounts/register/',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function(){
                    $('#reg-result').html('<div class="text-success">Registration successful! Go to login.</div>');
                },
                error: function(xhr){
                    $('#reg-result').html('<div class="text-danger">Registration failed: '+xhr.responseText+'</div>');
                }
            });
        });
    </script>
</body>
</html>
