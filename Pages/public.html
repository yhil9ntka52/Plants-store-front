<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Plant Store – Public</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 text-beige">Plant Store</span>
        </div>
    </nav>
    <div class="container">
        <h2>Welcome to Plant Store!</h2>
        <div class="mb-3">You can browse the catalog, see promotions and register or login to place orders.</div>
        <a href="login.html" class="btn btn-success menu-btn">Login</a>
        <a href="registration.html" class="btn btn-outline-success menu-btn">Register</a>
    </div>
    <footer class="footer mt-5 pt-3 text-center">
        PlantStore &copy; 2025
    </footer>
    <script>
        if (localStorage.getItem('access_token')) {
            document.write('<div class="container mt-4"><a href="private.html" class="btn btn-primary menu-btn">Go to account</a></div>');
        }
    </script>
</body>
</html>
