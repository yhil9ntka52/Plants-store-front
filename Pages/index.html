<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Plant Online Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { background: #f8f8ed; }
        .navbar { background: #194522 !important; border-bottom: 2px solid #204e29; }
        .text-beige { color: #f9f3e6 !important; }
        h2 { color: #1d341c; font-weight: 500; margin-top: 15px;}
        .btn-success { background: #194522; border: none; color: #fff; }
        .btn-success:hover { background: #34703b; box-shadow: 0 0 2px #b7d7a3;}
        #plants-list table { background: #f7fae3; }
        #plants-list th { background: #b7d7a3; }
        #plants-list td { background: #f0f7e6; }
        .text-danger { color: #dc3545 !important; font-weight: 500; }
        .text-success { color: #198754 !important; font-weight: 500; }
        .footer { background: #e5dcc2; color: #194522; }
        .container { background: #faf9f6; border-radius: 10px; box-shadow: 0 0 8px #ddeace; padding: 22px; margin-top: 32px;}
        #load-plants { margin-bottom: 10px;}
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 text-beige">Plant Online Store</span>
        </div>
    </nav>
    <div class="container mt-5">
        <h2 class="mb-4">Plant List</h2>
        <button id="load-plants" class="btn btn-success mb-3">Load Plants</button>
        <div id="plants-list"></div>
    </div>
    <footer class="mt-5 border-top pt-3 text-center footer">
        PlantStore &copy; 2025
    </footer>
    <script>
        $('#load-plants').click(function() {
            let token = localStorage.getItem('access_token');
            $.ajax({
                url: 'http://localhost:8000/api/v1/catalog/plants/',
                method: 'GET',
                dataType: 'json',
                headers: token ? { 'Authorization': 'Bearer ' + token } : {},
                success: function(data) {
                    let html = '';
                    if (data.length === 0) {
                        html = '<div class="text-danger">No plants available yet.</div>';
                    } else {
                        html = '<table class="table table-bordered table-striped"><thead><tr><th>Name</th><th>Price, ₴</th><th>Description</th></tr></thead><tbody>';
                        $.each(data, function(i, plant) {
                            html += `<tr>
                                <td>${plant.name}</td>
                                <td>${plant.price}</td>
                                <td>${plant.short_description || ''}</td>
                            </tr>`;
                        });
                        html += '</tbody></table>';
                    }
                    $('#plants-list').html(html);
                },
                error: function(xhr) {
                    if (xhr.status === 401) {
                        $('#plants-list').html('<div class="text-danger">Login required to access the API.</div>');
                    } else {
                        $('#plants-list').html('<div class="text-danger">Could not retrieve data from API.</div>');
                    }
                }
            });
        });
    </script>
</body>
</html>
