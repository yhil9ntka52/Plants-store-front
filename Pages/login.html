<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login – Plant Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 text-beige">Plant Store</span>
        </div>
    </nav>
    <div class="container" style="max-width:410px;">
        <h2>Login</h2>
        <form id="login-form">
            <input type="text" class="form-control mb-2" id="username" placeholder="Username" required>
            <input type="password" class="form-control mb-2" id="password" placeholder="Password" required>
            <button type="submit" class="btn btn-success w-100">Log In</button>
        </form>
        <div id="login-result" class="mt-2"></div>
        <div class="mt-4 text-end">
            <a href="registration.html" class="link-success">Create account</a>
        </div>
    </div>
    <footer class="footer mt-5 pt-3 text-center">
        PlantStore &copy; 2025
    </footer>
    <script>
        if (localStorage.getItem('access_token')) {
            window.location.href = 'private.html';
        }
        $('#login-form').submit(function(e){
            e.preventDefault();
            let username = $('#username').val();
            let password = $('#password').val();
            $.ajax({
                url: 'http://localhost:8000/api/v1/token/',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({username, password}),
                success: function(data){
                    localStorage.setItem('access_token', data.access);
                    localStorage.setItem('refresh_token', data.refresh);
                    localStorage.setItem('username', username);
                    $('#login-result').html('<div class="text-success">Login successful!</div>');
                    setTimeout(function() {
                        window.location.href = localStorage.getItem('redirect_after_login') || 'private.html';
                    }, 700);
                },
                error: function(){
                    $('#login-result').html('<div class="text-danger">Login failed. Try again.</div>');
                }
            });
        });
        let params = new URLSearchParams(window.location.search);
        if (params.get('next')) {
            localStorage.setItem('redirect_after_login', params.get('next'));
        }
    </script>
</body>
</html>
